[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/bot",
    "crates/cli",
    "crates/reconciler",
    "crates/setup",
]

[workspace.package]
# Bumped for the cli-v0.1.3 release: `release progress` now shows the fleet's
# view beside the bot's (#172), which is only useful once it is on a laptop —
# `install-cli.sh` downloads release binaries, not `main`.
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Ondrej Maxa"]
repository = "https://github.com/majnet/majnet"

[workspace.dependencies]
# async runtime + web
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }

# GitHub / git
octocrab = "0.44"
gix = "0.70"

# Docker
bollard = { version = "0.21", features = ["ssl"] }
futures-util = "0.3"

# http client (tarball downloads, reconciler notify)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# CLI (crates/cli): arg parsing + generated shell completions
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
# The CLI's interactive shell speaks the reconciler's terminal WebSocket
# (ADR 0016); libc gives it raw-mode termios without another dependency.
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-native-roots"] }
libc = "0.2"

# crypto (webhook signatures, App JWT key loading)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = "9"
secrecy = "0.10"

# serialization / config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# storage
rusqlite = { version = "0.34", features = ["bundled"] }
refinery = { version = "0.9.2", features = ["rusqlite"] }

# snapshot tarballs
tar = "0.4"
flate2 = "1"

# misc
anyhow = "1"
thiserror = "2"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
