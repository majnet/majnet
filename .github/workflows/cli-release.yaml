name: cli-release

# Cross-compiled `majnet` binaries attached to a GitHub release, so a laptop can
# install the CLI without a Rust toolchain (`scripts/install-cli.sh` downloads
# from here). The control-plane image builds the same binary from the same
# source (see Dockerfile); this job exists only to reach machines that are not
# nodes.

on:
  push:
    tags: ['v*', 'cli-v*']
  # Buildable on demand so a target can be verified before it is tagged.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl for Linux: one binary that runs on any distro, including the
          # older glibc on a node, rather than one per release of Debian.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: install cross linker (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi
      - run: cargo build --release -p majnet-cli --target ${{ matrix.target }}
      - name: package
        run: |
          set -euo pipefail
          name="majnet-${{ matrix.target }}"
          install -Dm755 "target/${{ matrix.target }}/release/majnet" "dist/$name/majnet"
          cp crates/cli/README.md crates/cli/docs/agent-guide.md "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"
          # Checksums travel with the archive; the installer verifies them, so a
          # truncated download fails loudly instead of installing half a binary.
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: majnet-${{ matrix.target }}
          path: |
            majnet-${{ matrix.target }}.tar.gz
            majnet-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title "$tag" --generate-notes --verify-tag || true
          gh release upload "$tag" artifacts/* --clobber
